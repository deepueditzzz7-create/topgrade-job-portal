<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Dashboard - TopGrade</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <script>
    if (localStorage.getItem("role") !== "student") {
      window.location.href = "index.html";
    }
  </script>

  <nav class="navbar">
    <div class="nav-left">
      <img src="Logo.png" alt="TopGrade Logo" class="nav-logo" />
    </div>
    <div class="nav-right">
      <span id="studentWelcome" class="welcome-text"></span>
      <button id="refreshBtn" class="refresh-btn">Refresh</button>
      <button id="themeToggle" class="theme-btn">🌙</button>
      <button id="studentLogoutBtn" class="logout-btn">Logout</button>
    </div>
  </nav>

  <div class="dashboard-container">
    <div class="main-tabs">
      <button class="main-tab active" data-category="Jobs">Jobs</button>
      <button class="main-tab" data-category="Hackathons">Hackathons</button>
      <button class="main-tab" data-category="Competitions">Competitions</button>
    </div>

    <div class="sub-filters" id="subFilters">
      <div class="sub-tabs">
        <button class="sub-tab active" data-type="All">All</button>
        <button class="sub-tab" data-type="Full Time">Full Time</button>
        <button class="sub-tab" data-type="Internship">Internship</button>
        <button class="sub-tab" data-type="Fresher">Fresher</button>
        <button class="sub-tab" data-type="Experienced">Experienced</button>
      </div>
      <div class="sort-tabs">
        <button class="sort-btn active" data-sort="new">Newest First</button>
        <button class="sort-btn" data-sort="old">Oldest First</button>
      </div>
    </div>

    <div class="search-wrapper">
      <input type="text" id="searchInput" placeholder="Search by title, company or location..." class="search-input" />
    </div>

    <div id="jobsContainer" class="jobs-grid"></div>

    <div id="noData" class="no-data hidden">
      <h2>No Opportunities Found</h2>
      <p>Try changing filters or search keywords.</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
