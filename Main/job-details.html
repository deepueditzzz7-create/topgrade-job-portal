<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Job Details - TopGrade</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">

    <div class="nav-left">
      <img src="Logo.png" alt="TopGrade Logo" class="nav-logo">
    </div>

    <div class="nav-right">

      <button class="back-btn" onclick="window.location.href='student.html'">
        ← Back
      </button>

    </div>

  </nav>

  <!-- DETAILS CONTAINER -->
  <div class="details-container">

    <div class="details-card" id="jobDetailsContainer">

      <!-- Dynamic Job Details -->

    </div>

    <!-- NO DATA -->
    <div id="detailsError" class="details-error hidden">

      <h2>Job Not Found</h2>

      <p>
        The requested opportunity does not exist or may have been removed.
      </p>

      <button
        class="primary-btn"
        onclick="window.location.href='student.html'"
      >
        Return to Dashboard
      </button>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
